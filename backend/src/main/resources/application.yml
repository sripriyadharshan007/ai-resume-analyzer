server:
  port: ${PORT:8080}

spring:
  application:
    name: ai-resume-analyzer-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom application properties
app:
  jwt:
    # 256-bit secret key for HS256 algorithm - set JWT_SECRET env variable in production
    secret: ${JWT_SECRET:9a2f98282d3d3f9b2d3d4f5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours default
  gemini:
    api-key: ${GEMINI_API_KEY:}
    api-url: https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.data.mongodb: INFO
