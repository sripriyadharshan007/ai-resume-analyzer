[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  CI = "false"

[[redirects]]
  from = "/api/*"
  to = "https://ai-resume-analyzer-6e7m.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
